    <script>
        // ========== 全局配置与状态 ==========
        const CONFIG = window.GLOBAL_CONFIG;
        const API_BASE = CONFIG.GITHUB_API_BASE;
        const DOWNLOAD_PROXY = CONFIG.DOWNLOAD_PROXY;
        const cache = new Map();
        const dirCache = new Map(); // 目录缓存

        let currentRepo = { owner: '', repo: '', branch: CONFIG.DEFAULT_BRANCH, path: '' };
        let globalRawMd = "";
        let globalTranslatedMd = "";
        let isTranslated = false;
        let isTranslating = false;

        // 主题映射
        const HLJS_THEME_MAP = {
            'ayu-dark': 'atom-one-dark', 'catppuccin-mocha': 'atom-one-dark',
            'github-dark': 'github-dark', 'dracula': 'dracula',
            'monokai': 'monokai', 'nord': 'nord',
            'one-dark': 'atom-one-dark', 'ayu-light': 'atom-one-light',
            'catppuccin-latte': 'atom-one-light', 'github-light': 'github',
        };

        // ========== 本地存储 ==========
        const storage = {
            get: key => { try { return JSON.parse(localStorage.getItem('ghr_' + key)) } catch { return null } },
            set: (key, val) => localStorage.setItem('ghr_' + key, JSON.stringify(val))
        };

        async function copyToClipboard(text) {
            try { await navigator.clipboard.writeText(text); return true; }
            catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta); return true;
            }
        }

        function bindCodeCopyButtons(container = document) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'code-copy-btn';
                btn.innerText = '复制';
                btn.onclick = async () => {
                    const code = pre.querySelector('code');
                    const ok = await copyToClipboard(code ? code.innerText : pre.innerText);
                    if (ok) { btn.innerText = '已复制'; btn.classList.add('copied');
                        setTimeout(() => { btn.innerText = '复制'; btn.classList.remove('copied'); }, 1500); }
                };
                pre.appendChild(btn);
            });
        }

        // ========== 图片代理 ==========
        function proxyImages(container, owner, repo, branch, currentPath) {
            if (!CONFIG.ENABLE_IMAGE_PROXY) return;
            const imgs = container.querySelectorAll('img');
            const baseRawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}`;

            imgs.forEach(img => {
                const src = img.getAttribute('src') || '';
                if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;

                let rawUrl;
                if (src.startsWith('http')) {
                    if (src.includes('raw.githubusercontent.com')) {
                        rawUrl = src;
                    } else {
                        return;
                    }
                } else {
                    const dirPath = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/')) : '';
                    const fullPath = dirPath ? `${dirPath}/${src}` : src;
                    rawUrl = `${baseRawUrl}/${fullPath}`;
                }

                const proxiedUrl = DOWNLOAD_PROXY + rawUrl;
                img.setAttribute('data-original-src', rawUrl);
                img.src = proxiedUrl;

                img.onerror = function() {
                    if (this.src !== rawUrl) {
                        this.src = rawUrl;
                        this.onerror = null;
                    }
                };
            });
        }

        // ========== GitHub 请求 ==========
        const request = async (path) => {
            if (cache.has(path)) return cache.get(path);
            const token = storage.get('github_token');
            const headers = { Accept: 'application/vnd.github.v3+json' };
            if (token) headers.Authorization = 'token ' + token;

            const res = await fetch(API_BASE + path, { headers });
            if (res.status === 403 && res.headers.get('X-RateLimit-Remaining') === '0') {
                throw new Error('API 请求频率超限，请在设置中添加 PAT');
            }
            if (!res.ok) throw new Error('请求失败：' + res.status + ' ' + res.statusText);
            
            const data = await res.json();
            cache.set(path, data);
            return data;
        };

        const decodeBase64 = str => {
            try { return decodeURIComponent(escape(window.atob(str))) }
            catch { return window.atob(str) }
        };

        const escapeHtml = str => {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };

        function parseInputText(inputText) {
            let text = inputText.trim();
            text = text.replace(/^https?:\/\//, '').replace(/^github\.com\//, '');
            return text;
        }

        function isMarkdownFile(filename) {
            return filename.toLowerCase().endsWith('.md') || filename.toLowerCase().endsWith('.markdown');
        }

        // ========== 翻译功能 ==========
        async function translateMarkdown(mdText) {
            const apiKey = storage.get('translate_api_key') || CONFIG.TRANSLATE_API_KEY;
            if (!apiKey) throw new Error('缺少翻译 API 密钥，请在设置中添加后重试');

            const apiBase = CONFIG.TRANSLATE_API_BASE.replace(/\/$/, '');
            const url = `${apiBase}/chat/completions`;

            const prompt = `请将以下 Markdown 文档翻译成中文。保持原有格式不变，不要添加任何注释或解释，直接输出翻译后的 Markdown 文档。
注意：
1. 代码块内容不要翻译
2. URL、邮箱、命令行参数保持原样
3. 专有名词首次出现可以括号标注英文
4. 保持原有 Markdown 结构，包括标题、列表、表格、引用等
5. 不要修改文档中的 Markdown 语法

待翻译内容：
 ${mdText}`;

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ model: CONFIG.TRANSLATE_MODEL, messages: [{ role: 'user', content: prompt }], temperature: 0.3 })
            });

            if (!res.ok) {
                let errMsg = res.statusText;
                try { const err = await res.json(); errMsg = err.error?.message || errMsg; } catch {}
                throw new Error(`翻译失败 (${res.status})：${errMsg}`);
            }

            const data = await res.json();
            return data.choices[0].message.content.trim();
        }

        function bindTranslateButton(rawMdText) {
            globalRawMd = rawMdText;
            globalTranslatedMd = "";
            isTranslated = false;
            
            const transBtn = document.getElementById("trigger-translate");
            const mdBox = document.getElementById("md-container");
            if (!transBtn || !mdBox) return;

            transBtn.disabled = false;
            transBtn.innerText = "🌐 翻译/原文";

            transBtn.onclick = async () => {
                if (isTranslating) return;

                if (isTranslated) {
                    mdBox.innerHTML = marked.parse(globalRawMd);
                    transBtn.innerText = "🌐 翻译/原文";
                    isTranslated = false;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox);
                    proxyImages(mdBox, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    return;
                }

                if (globalTranslatedMd) {
                    mdBox.innerHTML = marked.parse(globalTranslatedMd);
                    transBtn.innerText = "↩ 查看原文";
                    isTranslated = true;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox);
                    proxyImages(mdBox, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    return;
                }

                isTranslating = true;

                    mdBox.innerHTML = marked.parse(globalTranslatedMd);
                    transBtn.innerText = "↩ 查看原文";
                    isTranslated = true;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox);
                    proxyImages(mdBox, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                } catch (e) {

        // ========== 面板切换（已重写：含拖拽与展开按钮） ==========
        const PANEL_MIN = 160;
        const PANEL_MAX = 560;

        function initResizer(resizer) {
            const panel = document.getElementById(resizer.dataset.target);
            const side  = resizer.dataset.side;
            let startX = 0, startWidth = 0;

            const onMove = (e) => {
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const dx = x - startX;
                const w = Math.max(
                    PANEL_MIN,
                    Math.min(PANEL_MAX, side === 'left' ? startWidth + dx : startWidth - dx)
                );
                panel.style.width = w + 'px';
                storage.set('panel_width_' + side, w);
            };

            const onUp = () => {
                panel.classList.remove('dragging');
                resizer.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onUp);
            };

            const onDown = (e) => {
                if (panel.classList.contains('collapsed')) return;
                startX = e.touches ? e.touches[0].clientX : e.clientX;
                startWidth = panel.offsetWidth;
                panel.classList.add('dragging');
                resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onUp);
                e.preventDefault();
            };

            resizer.addEventListener('mousedown',  onDown);
            resizer.addEventListener('touchstart', onDown, { passive: false });
        }

        function showExpandButton(side, show) {
            const btn = document.getElementById('expand-' + side);
            if (!btn) return;
            btn.style.display = show ? 'flex' : 'none';
            btn.style[side] = '0';
        }

        function togglePanel(side) {
            const panel   = document.getElementById('panel-' + side);
            const resizer = document.getElementById('resizer-' + side);
            const collapsed = panel.classList.toggle('collapsed');

            if (resizer) resizer.style.display = collapsed ? 'none' : 'block';
            showExpandButton(side, collapsed);

            const btn = panel.querySelector('.panel-toggle-btn');
            if (btn) btn.textContent = collapsed
                ? (side === 'left' ? '▶' : '◀')
                : (side === 'left' ? '◀' : '▶');

            storage.set('panel_collapsed_' + side, collapsed);
        }

        function expandPanel(side) {
            const panel = document.getElementById('panel-' + side);
            if (panel.classList.contains('collapsed')) togglePanel(side);
        }

        function initSidebar() {
            document.querySelectorAll('.resizer').forEach(initResizer);
            document.querySelectorAll('.panel-expand-btn').forEach(btn =>
                btn.addEventListener('click', () => expandPanel(btn.dataset.side))
            );

            ['left', 'right'].forEach(side => {
                const panel = document.getElementById('panel-' + side);
                const w = storage.get('panel_width_' + side);
                if (w) panel.style.width = w + 'px';

                if (storage.get('panel_collapsed_' + side)) {
                    panel.classList.add('collapsed');
                    const r = document.getElementById('resizer-' + side);
                    if (r) r.style.display = 'none';
                    showExpandButton(side, true);
                    const btn = panel.querySelector('.panel-toggle-btn');
                    if (btn) btn.textContent = side === 'left' ? '▶' : '◀';
                }
            });
        }

        // ========== 文件树（VS Code 风格三栏布局） ==========
        async function loadFileTree(owner, repo, path = '') {
            const cacheKey = `${owner}/${repo}/${path}`;
            if (dirCache.has(cacheKey)) return dirCache.get(cacheKey);

            try {
                const data = await request(`/repos/${owner}/${repo}/contents/${path}`);
                data.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });
                dirCache.set(cacheKey, data);
                return data;
            } catch (e) {
                console.error('加载目录失败：', e);
                return [];
            }
        }

        function renderFileTree(items, parentPath = '', level = 0) {
            let html = '';
            items.forEach(item => {
                const fullPath = parentPath ? `${parentPath}/${item.name}` : item.name;
                const isDir = item.type === 'dir';
                const isActive = fullPath === currentRepo.path;

                if (isDir) {
                    html += `
                    <div class="tree-item dir" data-path="${fullPath}" onclick="toggleDir(this, '${fullPath}')">
                        <span class="tree-arrow">▶</span>
                        <span class="tree-icon">📁</span>
                        <span>${item.name}</span>
                    </div>
                    <div class="tree-children" data-path="${fullPath}"></div>`;
                } else {
                    html += `
                    <div class="tree-item file ${isActive ? 'active' : ''}" data-path="${fullPath}" onclick="openFile('${fullPath}')">
                        <span class="tree-arrow"></span>
                        <span class="tree-icon">📄</span>
                        <span>${item.name}</span>
                    </div>`;
                }
            });
            return html;
        }

        async function toggleDir(el, path) {
            const isExpanded = el.classList.contains('expanded');
            const childrenEl = el.nextElementSibling;

            if (isExpanded) {
                el.classList.remove('expanded');
                return;
            }

            el.classList.add('expanded');
            if (childrenEl.innerHTML.trim()) return;

            const items = await loadFileTree(currentRepo.owner, currentRepo.repo, path);
            childrenEl.innerHTML = renderFileTree(items, path, 1);
        }

        async function initFileTree(owner, repo) {
            currentRepo.owner = owner;
            currentRepo.repo = repo;
            const items = await loadFileTree(owner, repo, '');
            document.getElementById('file-tree').innerHTML = renderFileTree(items, '');
        }

        async function openFile(path) {
            currentRepo.path = path;
            document.querySelectorAll('#file-tree .tree-item.file').forEach(el => {
                el.classList.toggle('active', el.dataset.path === path);
            });

            try {
                const data = await request(`/repos/${currentRepo.owner}/${currentRepo.repo}/contents/${path}`);
                renderFileContent(data);
            } catch (e) {

        }

                        <div class="grid gap-3">
                            ${repos.map(r => `
                                <a href="#/${r.full_name}" class="block bg-bg-2 border border-border rounded-lg p-4 hover:border-primary transition-colors">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="font-medium text-primary">${r.full_name}</span>
                                        <span class="text-text-3 text-xs">⭐ ${r.stargazers_count}</span>
                                    </div>
                                    ${r.description ? `<p class="text-text-2 text-sm line-clamp-2">${r.description}</p>` : ''}
                                </a>`).join('')}
                        </div>`;
                }
                else if (route.type === 'releases') await renderReleases(route.owner, route.repo);
                else await renderRepo(route.owner, route.repo, route.path);
            } catch (err) {
                document.getElementById('main-content').innerHTML = `
                    <div class="text-center py-20">
                        <div class="text-red-400 mb-2">出错了</div>
                        <div class="text-text-3">${err.message}</div>
                    </div>`;
            }
        };

        // ========== 事件初始化 ==========
        const initEvents = () => {
            // 主题切换
            document.getElementById('theme-select').addEventListener('change', e => {
                const theme = e.target.value;
                document.documentElement.setAttribute('data-theme', theme);
                storage.set('theme', theme);
                const hljsName = HLJS_THEME_MAP[theme] || 'atom-one-dark';
                document.getElementById('hljs-style').href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${hljsName}.min.css`;
            });

            // 搜索框回车
            document.getElementById('search-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    const rawVal = e.target.value.trim();
                    if (!rawVal) return;
                    window.location.hash = '/' + parseInputText(rawVal);
                }
            });

            // 设置弹窗
            const modal = document.getElementById('settings-modal');
            document.getElementById('settings-btn').addEventListener('click', () => {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.getElementById('token-input').value = storage.get('github_token') || '';
                document.getElementById('translate-api-key').value = storage.get('translate_api_key') || '';
            });

            document.getElementById('close-settings').addEventListener('click', () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            });

            document.getElementById('save-settings').addEventListener('click', () => {
                storage.set('github_token', document.getElementById('token-input').value.trim());
                storage.set('translate_api_key', document.getElementById('translate-api-key').value.trim());
                cache.clear();
                dirCache.clear();
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                handleRoute();
            });

            modal.addEventListener('click', e => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });

            window.addEventListener('hashchange', handleRoute);
        };

        // ========== 初始化执行 ==========
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = storage.get('theme') || 'ayu-dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-select').value = savedTheme;
            const hljsName = HLJS_THEME_MAP[savedTheme] || 'atom-one-dark';
            document.getElementById('hljs-style').href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${hljsName}.min.css`;

            initEvents();
            initSidebar();   // ← 新增：初始化侧边栏拖拽与展开按钮
            handleRoute();
        });
    </script>
</body>
</html>
