    <script>
        // ========== 全局配置与状态 ==========
        const CONFIG = window.GLOBAL_CONFIG;
        const API_BASE = CONFIG.GITHUB_API_BASE;
        const DOWNLOAD_PROXY = CONFIG.DOWNLOAD_PROXY;
        const cache = new Map();
        const dirCache = new Map();

        let currentRepo = { owner: '', repo: '', branch: '', path: '' };
        let globalRawMd = "";
        let globalTranslatedMd = "";
        let isTranslated = false;
        let isTranslating = false;
        let outlineObserver = null;

        const HLJS_THEME_MAP = {
            'ayu-dark': 'atom-one-dark', 'catppuccin-mocha': 'atom-one-dark',
            'github-dark': 'github-dark', 'dracula': 'dracula',
            'monokai': 'monokai', 'nord': 'nord',
            'one-dark': 'atom-one-dark', 'ayu-light': 'atom-one-light',
            'catppuccin-latte': 'atom-one-light', 'github-light': 'github',
        };

        const storage = {
            get: key => { try { return JSON.parse(localStorage.getItem('ghr_' + key)) } catch { return null } },
            set: (key, val) => localStorage.setItem('ghr_' + key, JSON.stringify(val))
        };

        // ========== 终极修复：手动拼接路径，保护分支名不被 ../ 吃掉 ==========
        function fixUrl(src, owner, repo, branch, currentPath) {
            if (!src || src.startsWith('data:') || src.startsWith('blob:')) return src;
            
            const branchPath = branch.startsWith('refs/heads/') ? branch : `refs/heads/${branch}`;
            const baseRawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branchPath}/`;
            
            if (src.startsWith('http://') || src.startsWith('https://')) {
                if (src.includes('raw.githubusercontent.com')) {
                    if (!src.includes('/refs/heads/') && !src.includes('/refs/tags/')) {
                        const match = src.match(/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)/);
                        if (match) {
                            const [_, o, r, b, p] = match;
                            src = `https://raw.githubusercontent.com/${o}/${r}/refs/heads/${b}/${p}`;
                        }
                    }
                    return DOWNLOAD_PROXY + src;
                }
                if (src.includes('github.com') && src.includes('/blob/')) {
                    let raw = src.replace('github.com/', 'raw.githubusercontent.com/').replace('/blob/', '/');
                    if (!raw.includes('/refs/heads/') && !raw.includes('/refs/tags/')) {
                        const match = raw.match(/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)/);
                        if (match) {
                            const [_, o, r, b, p] = match;
                            raw = `https://raw.githubusercontent.com/${o}/${r}/refs/heads/${b}/${p}`;
                        }
                    }
                    return DOWNLOAD_PROXY + raw;
                }
                return src; 
            }
            
            // 处理相对路径
            let dirPath = '';
            if (currentPath) {
                const lastSlash = currentPath.lastIndexOf('/');
                if (lastSlash !== -1) {
                    dirPath = currentPath.substring(0, lastSlash + 1);
                }
            }

            // 如果以 / 开头，表示从仓库根目录开始
            if (src.startsWith('/')) {
                src = src.substring(1);
                dirPath = '';
            }

            // 去掉开头的 ./
            if (src.startsWith('./')) {
                src = src.substring(2);
            }

            // 手动拼接并规范化路径，防止分支名被抵消
            let parts = (dirPath ? dirPath.split('/') : []).concat(src.split('/'));
            let res = [];
            for (let part of parts) {
                if (part === '..') {
                    if (res.length > 0) {
                        res.pop(); // 只有在非空时才弹出，不会抵消分支名
                    }
                } else if (part === '.' || part === '') {
                    // ignore
                } else {
                    res.push(part);
                }
            }
            const cleanPath = res.join('/');
            const rawUrl = baseRawUrl + cleanPath;
            return DOWNLOAD_PROXY + rawUrl;
        }

        // 1. 解析前预处理 Markdown 原文
        function preProcessMarkdown(mdText, owner, repo, branch, currentPath) {
            if (!CONFIG.ENABLE_IMAGE_PROXY) return mdText;

            mdText = mdText.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+["']([^"']*)["'])?\)/g, (match, alt, src, title) => {
                const fixedSrc = fixUrl(src, owner, repo, branch, currentPath);
                const titlePart = title ? ` "${title}"` : '';
                return `![${alt}](${fixedSrc}${titlePart})`;
            });

            mdText = mdText.replace(/^\[([^\]]+)\]:\s*(.+)$/gm, (match, id, url) => {
                const fixedUrl = fixUrl(url.trim(), owner, repo, branch, currentPath);
                return `[${id}]: ${fixedUrl}`;
            });

            mdText = mdText.replace(/<img([^>]+)src="([^"]+)"/g, (match, attrs, src) => {
                const fixedSrc = fixUrl(src, owner, repo, branch, currentPath);
                return `<img${attrs}src="${fixedSrc}"`;
            });

            mdText = mdText.replace(/<a([^>]+)href="([^"]+)"/g, (match, attrs, href) => {
                if (/\.(png|jpg|jpeg|gif|webp|svg|bmp|ico)$/i.test(href)) {
                    const fixedHref = fixUrl(href, owner, repo, branch, currentPath);
                    return `<a${attrs}href="${fixedHref}"`;
                }
                return match;
            });

            return mdText;
        }

        // 2. 解析后兜底处理 HTML
        function postProcessHtml(html, owner, repo, branch, currentPath) {
            if (!CONFIG.ENABLE_IMAGE_PROXY) return html;
            return html.replace(/<img([^>]+)src="([^"]+)"/g, (match, attrs, src) => {
                if (src.startsWith(DOWNLOAD_PROXY)) return match;
                const fixedSrc = fixUrl(src, owner, repo, branch, currentPath);
                return `<img${attrs}src="${fixedSrc}"`;
            });
        }

        async function copyToClipboard(text) {
            try { await navigator.clipboard.writeText(text); return true; }
            catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta); return true;
            }
        }

        function bindCodeCopyButtons(container = document) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'code-copy-btn';
                btn.innerText = '复制';
                btn.onclick = async () => {
                    const code = pre.querySelector('code');
                    const ok = await copyToClipboard(code ? code.innerText : pre.innerText);
                    if (ok) { btn.innerText = '已复制'; btn.classList.add('copied');
                        setTimeout(() => { btn.innerText = '复制'; btn.classList.remove('copied'); }, 1500); }
                };
                pre.appendChild(btn);
            });
        }

        const request = async (path) => {
            if (cache.has(path)) return cache.get(path);
            const token = storage.get('github_token');
            const headers = { Accept: 'application/vnd.github.v3+json' };
            if (token) headers.Authorization = 'token ' + token;
            const res = await fetch(API_BASE + path, { headers });
            if (res.status === 403 && res.headers.get('X-RateLimit-Remaining') === '0') throw new Error('API 请求频率超限，请在设置中添加 PAT');
            if (!res.ok) throw new Error('请求失败：' + res.status + ' ' + res.statusText);
            const data = await res.json();
            cache.set(path, data);
            return data;
        };

        const decodeBase64 = str => { try { return decodeURIComponent(escape(window.atob(str))) } catch { return window.atob(str) } };
        const escapeHtml = str => { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };
        function parseInputText(inputText) { return inputText.trim().replace(/^https?:\/\//, '').replace(/^github\.com\//, ''); }
        function isMarkdownFile(filename) { return filename.toLowerCase().endsWith('.md') || filename.toLowerCase().endsWith('.markdown'); }
        function isImageFile(filename) {
            const exts = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp', '.ico'];
            return exts.some(ext => filename.toLowerCase().endsWith(ext));
        }

        // ========== 翻译功能（含地址自动补全） ==========
        async function translateMarkdown(mdText) {
            const apiKey = storage.get('translate_api_key') || CONFIG.TRANSLATE_API_KEY;
            if (!apiKey) throw new Error('缺少翻译 API 密钥，请在设置中添加后重试');
            
            let apiBase = CONFIG.TRANSLATE_API_BASE.replace(/\/$/, '');
            let url;
            if (apiBase.endsWith('/v1')) {
                url = `${apiBase}/chat/completions`;
            } else if (apiBase.endsWith('/chat/completions')) {
                url = apiBase;
            } else {
                url = `${apiBase}/v1/chat/completions`;
            }

            const prompt = `请将以下 Markdown 文档翻译成中文。保持原有格式不变，不要添加任何注释或解释，直接输出翻译后的 Markdown 文档。\n注意：\n1. 代码块内容不要翻译\n2. URL、邮箱、命令行参数保持原样\n3. 专有名词首次出现可以括号标注英文\n4. 保持原有 Markdown 结构\n5. 不要修改文档中的 Markdown 语法\n\n待翻译内容：\n${mdText}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ model: CONFIG.TRANSLATE_MODEL, messages: [{ role: 'user', content: prompt }], temperature: 0.3 })
            });
            if (!res.ok) { let errMsg = res.statusText; try { const err = await res.json(); errMsg = err.error?.message || errMsg; } catch {} throw new Error(`翻译失败 (${res.status})：${errMsg}`); }
            const data = await res.json();
            return data.choices[0].message.content.trim();
        }

        function bindTranslateButton(rawMdText) {
            globalRawMd = rawMdText; globalTranslatedMd = ""; isTranslated = false;
            const transBtn = document.getElementById("trigger-translate");
            const mdBox = document.getElementById("md-container");
            if (!transBtn || !mdBox) return;
            transBtn.disabled = false; transBtn.innerText = "🌐 翻译/原文";
            transBtn.onclick = async () => {
                if (isTranslating) return;
                if (isTranslated) {
                    const fixedMd = preProcessMarkdown(globalRawMd, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    let html = marked.parse(fixedMd);
                    html = postProcessHtml(html, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    mdBox.innerHTML = html;
                    transBtn.innerText = "🌐 翻译/原文"; isTranslated = false;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox); generateOutline(); return;
                }
                if (globalTranslatedMd) {
                    const fixedMd = preProcessMarkdown(globalTranslatedMd, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    let html = marked.parse(fixedMd);
                    html = postProcessHtml(html, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    mdBox.innerHTML = html;
                    transBtn.innerText = "↩ 查看原文"; isTranslated = true;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox); generateOutline(); return;
                }
                isTranslating = true; transBtn.disabled = true; transBtn.innerText = "翻译中...";
                try {
                    globalTranslatedMd = await translateMarkdown(globalRawMd);
                    const fixedMd = preProcessMarkdown(globalTranslatedMd, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    let html = marked.parse(fixedMd);
                    html = postProcessHtml(html, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                    mdBox.innerHTML = html;
                    transBtn.innerText = "↩ 查看原文"; isTranslated = true;
                    mdBox.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    bindCodeCopyButtons(mdBox); generateOutline();
                } catch (e) { console.error("翻译出错：", e); alert(e.message); transBtn.innerText = "🌐 翻译/原文"; }
                finally { isTranslating = false; transBtn.disabled = false; }
            };
        }

        // ========== 面板切换与拖拽 ============
        const PANEL_MIN = 160; const PANEL_MAX = 560;
        function initResizer(resizer) {
            const panel = document.getElementById(resizer.dataset.target);
            const side  = resizer.dataset.side; let startX = 0, startWidth = 0;
            const onMove = (e) => {
                const x = e.touches ? e.touches[0].clientX : e.clientX; const dx = x - startX;
                const w = Math.max(PANEL_MIN, Math.min(PANEL_MAX, side === 'left' ? startWidth + dx : startWidth - dx));
                panel.style.width = w + 'px'; storage.set('panel_width_' + side, w);
            };
            const onUp = () => { panel.classList.remove('dragging'); resizer.classList.remove('dragging'); document.body.style.cursor = ''; document.body.style.userSelect = ''; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
            const onDown = (e) => {
                if (panel.classList.contains('collapsed')) return;
                startX = e.touches ? e.touches[0].clientX : e.clientX; startWidth = panel.offsetWidth;
                panel.classList.add('dragging'); resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
                document.addEventListener('touchmove', onMove, { passive: false }); document.addEventListener('touchend', onUp);
                e.preventDefault();
            };
            resizer.addEventListener('mousedown',  onDown); resizer.addEventListener('touchstart', onDown, { passive: false });
        }
        function showExpandButton(side, show) { const btn = document.getElementById('expand-' + side); if (!btn) return; btn.style.display = show ? 'flex' : 'none'; btn.style[side] = '0'; }
        function togglePanel(side) {
            const panel = document.getElementById('panel-' + side); const resizer = document.getElementById('resizer-' + side);
            const collapsed = panel.classList.toggle('collapsed');
            if (resizer) resizer.style.display = collapsed ? 'none' : 'block';
            showExpandButton(side, collapsed);
            const btn = panel.querySelector('.panel-toggle-btn');
            if (btn) btn.textContent = collapsed ? (side === 'left' ? '❯' : '❮') : (side === 'left' ? '❮' : '❯');
            storage.set('panel_collapsed_' + side, collapsed);
        }
        function expandPanel(side) { const panel = document.getElementById('panel-' + side); if (panel.classList.contains('collapsed')) togglePanel(side); }
        function initSidebar() {
            document.querySelectorAll('.resizer').forEach(initResizer);
            document.querySelectorAll('.panel-expand-btn').forEach(btn => btn.addEventListener('click', () => expandPanel(btn.dataset.side)));
            ['left', 'right'].forEach(side => {
                const panel = document.getElementById('panel-' + side); const w = storage.get('panel_width_' + side);
                if (w) panel.style.width = w + 'px';
                if (storage.get('panel_collapsed_' + side)) {
                    panel.classList.add('collapsed'); const r = document.getElementById('resizer-' + side);
                    if (r) r.style.display = 'none'; showExpandButton(side, true);
                    const btn = panel.querySelector('.panel-toggle-btn'); if (btn) btn.textContent = side === 'left' ? '❯' : '❮';
                }
            });
        }

        // ========== 右栏 Tab 切换 ==========
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => {
                if (t.dataset.tab === 'outline' && name !== 'outline') {

        // ========== 文件树（纯缩进 + SVG 图标 + 自动收起） ==========
        function getFileIcon(name, isDir) {
            const ext = name.split('.').pop().toLowerCase();
            const color = 'currentColor';
            if (isDir) return `<svg viewBox="0 0 16 16" width="16" height="16" fill="${color}" style="color: var(--primary);"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5L5.5 1H1.75z"></path></svg>`;
            if (ext === 'md') return `<svg viewBox="0 0 16 16" width="16" height="16" fill="${color}" style="color: var(--accent);"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.693a.75.75 0 0 1 .624.334l2.312 3.516H15.25a.75.75 0 0 1 .75.75v8.5a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1-.75-.75V1.75zm1.5.75v11.5h13V6.85H7.5a.75.75 0 0 1-.624-.334L4.564 3H1.5z"></path><path d="M3.5 8.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5zm2.5.5a.5.5 0 0 0-1 0v3a.5.5 0 0 0 1 0v-3zm1.5-.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5zm2.5.5a.5.5 0 0 0-1 0v3a.5.5 0 0 0 1 0v-3zm1.5-.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5z"></path></svg>`;
            if (isImageFile(name)) return `<svg viewBox="0 0 16 16" width="16" height="16" fill="${color}" style="color: var(--accent);"><path d="M0 1.75A.75.75 0 0 1 .75 1h14.5a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1-.75-.75V1.75zm1.5.75v11h13V2.5h-13z"></path><path d="M5.5 6.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"></path><path d="M3.5 13l3-3 2 2 3-3 2.5 2.5v1.5h-11z"></path></svg>`;
            return `<svg viewBox="0 0 16 16" width="16" height="16" fill="${color}" style="color: var(--text-muted);"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.46 0 .903.184 1.229.51l2.415 2.415c.326.326.51.77.51 1.229v10.096A1.75 1.75 0 0 1 12.75 16h-9A1.75 1.75 0 0 1 2 14.25V1.75zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9a.25.25 0 0 0 .25-.25V4.154H9.75A.75.75 0 0 1 9 3.404V1.5H3.75z"></path></svg>`;
        }

        async function loadFileTree(owner, repo, path = '') {
            const cacheKey = `${owner}/${repo}/${currentRepo.branch}/${path}`;
            if (dirCache.has(cacheKey)) return dirCache.get(cacheKey);
            try {
                const data = await request(`/repos/${owner}/${repo}/contents/${path}?ref=${currentRepo.branch}`);
                data.sort((a, b) => { if (a.type === b.type) return a.name.localeCompare(b.name); return a.type === 'dir' ? -1 : 1; });
                dirCache.set(cacheKey, data); return data;
            } catch (e) { console.error('加载目录失败：', e); return []; }
        }

        function renderFileTree(items, parentPath = '', level = 0) {
            let html = '';
            items.forEach(item => {
                const fullPath = parentPath ? `${parentPath}/${item.name}` : item.name;
                const isDir = item.type === 'dir';
                const isActive = fullPath === currentRepo.path;
                const padding = 12 + level * 16;
                const icon = getFileIcon(item.name, isDir);
                if (isDir) {
                    html += `<div class="tree-item dir" style="padding-left: ${padding}px;" data-path="${fullPath}" onclick="toggleDir(this, '${fullPath}')"><span class="tree-arrow">❯</span><span class="tree-icon">${icon}</span><span>${item.name}</span></div><div class="tree-children" data-path="${fullPath}"></div>`;
                } else {
                    html += `<div class="tree-item file ${isActive ? 'active' : ''}" style="padding-left: ${padding}px;" data-path="${fullPath}" onclick="openFile('${fullPath}')"><span class="tree-arrow"></span><span class="tree-icon">${icon}</span><span>${item.name}</span></div>`;
                }
            });
            return html;
        }

        async function toggleDir(el, path) {
            const isExpanded = el.classList.contains('expanded');
            const childrenEl = el.nextElementSibling;
            if (isExpanded) { el.classList.remove('expanded'); return; }
            
            const parentChildrenContainer = el.parentElement;
            if (parentChildrenContainer.classList.contains('tree-children')) {
                parentChildrenContainer.querySelectorAll(':scope > .tree-item.dir.expanded').forEach(sibling => {
                    if (sibling !== el) sibling.classList.remove('expanded');
                });
            }

            el.classList.add('expanded');
            if (childrenEl.innerHTML.trim()) return;
            const items = await loadFileTree(currentRepo.owner, currentRepo.repo, path);
            const level = (el.style.paddingLeft.replace('px', '') - 12) / 16 + 1;
            childrenEl.innerHTML = renderFileTree(items, path, level);
        }

        async function initFileTree(owner, repo) {
            currentRepo.owner = owner; currentRepo.repo = repo;
            const items = await loadFileTree(owner, repo, '');
            document.getElementById('file-tree').innerHTML = renderFileTree(items, '', 0);
        }

        async function openFile(path) {
            currentRepo.path = path;
            navigateTo(`${currentRepo.owner}/${currentRepo.repo}/${path}`);
            document.querySelectorAll('#file-tree .tree-item.file').forEach(el => el.classList.toggle('active', el.dataset.path === path));
            try {
                const data = await request(`/repos/${currentRepo.owner}/${currentRepo.repo}/contents/${path}?ref=${currentRepo.branch}`);
                renderFileContent(data);
            } catch (e) {
                document.getElementById('main-content').innerHTML = `<div class="text-center py-20"><div class="text-red-400 mb-2">加载失败</div><div class="text-text-3">${e.message}</div></div>`;
            }
        }

        // ========== 大纲提取与高亮 ==========
        function generateOutline() {
            const mdBox = document.getElementById('md-container');
            const outlineBox = document.getElementById('view-outline');
            if (!mdBox || !outlineBox) return;

            const headers = mdBox.querySelectorAll('h1, h2, h3, h4');
            if (headers.length === 0) {
                outlineBox.innerHTML = '<div class="p-3 text-text-3 text-sm">暂无大纲</div>';
                switchTab('prop');
                return;
            }

            let html = '';
            headers.forEach((h, i) => {
                const level = h.tagName.toLowerCase();
                const text = h.textContent;
                const id = `outline-header-${i}`;
                h.id = id;
                html += `<div class="outline-item level-${level.replace('h', '')}" data-target="${id}">${text}</div>`;
            });
            outlineBox.innerHTML = html;
            switchTab('outline');

            outlineBox.querySelectorAll('.outline-item').forEach(item => {
                item.addEventListener('click', () => {
                    const target = document.getElementById(item.dataset.target);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            if (outlineObserver) outlineObserver.disconnect();
            outlineObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        outlineBox.querySelectorAll('.outline-item').forEach(item => {
                            item.classList.toggle('active', item.dataset.target === id);
                        });
                    }
                });
            }, { rootMargin: '0px 0px -80% 0px' });

            headers.forEach(h => outlineObserver.observe(h));
        }

        function jumpToReleases() { navigateTo(`${currentRepo.owner}/${currentRepo.repo}/releases`); }

        // ========== 文档内容 ==========
        function renderFileContent(fileData) {
            const rawContent = decodeBase64(fileData.content);
            const proxyUrl = DOWNLOAD_PROXY + fileData.download_url;
            const filename = fileData.name;
            let html = '';
            
            if (isMarkdownFile(filename)) {
                const fixedMd = preProcessMarkdown(rawContent, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                let parsedHtml = marked.parse(fixedMd);
                parsedHtml = postProcessHtml(parsedHtml, currentRepo.owner, currentRepo.repo, currentRepo.branch, currentRepo.path);
                
                html = `<div class="relative">
                    <div class="action-bar">
                        <button class="action-btn" id="copy-file-btn">📋 复制</button>
                        <a href="${proxyUrl}" target="_blank" download="${filename}" class="action-btn">⬇ 下载</a>
                        <button class="action-btn" id="trigger-translate">🌐 翻译/原文</button>
                    </div>
                    <div id="md-container" class="markdown-body bg-bg-2 border border-border rounded-lg p-6 pt-12">${parsedHtml}</div>
                </div>`;
                document.getElementById('main-content').innerHTML = html;
                bindTranslateButton(rawContent);
                document.querySelectorAll('#md-container pre code').forEach(block => hljs.highlightElement(block));
                bindCodeCopyButtons(document.getElementById('md-container'));
                document.getElementById('copy-file-btn').onclick = async () => { const ok = await copyToClipboard(rawContent); if (ok) { const btn = document.getElementById('copy-file-btn'); const orig = btn.innerText; btn.innerText = '✓ 已复制'; setTimeout(() => btn.innerText = orig, 1500); } };
                generateOutline();
            } else if (isImageFile(filename)) {
                html = `<div class="relative">
                    <div class="action-bar">
                        <a href="${proxyUrl}" target="_blank" download="${filename}" class="action-btn">⬇ 下载</a>
                    </div>
                    <div class="image-viewer-container">
                        <img src="${proxyUrl}" alt="${filename}" onerror="this.onerror=null; this.src='${fileData.download_url}'">
                    </div>
                </div>`;
                document.getElementById('main-content').innerHTML = html;
                document.getElementById('view-outline').innerHTML = '<div class="p-3 text-text-3 text-sm">暂无大纲</div>';
                switchTab('prop');
            } else {
                html = `<div class="flex justify-between items-center mb-2">
                    <span class="text-text-2 text-sm">${filename}</span>
                    <div class="flex gap-2">
                        <button class="action-btn text-sm" id="copy-file-btn">📋 复制</button>
                        <a href="${proxyUrl}" target="_blank" download="${filename}" class="action-btn text-sm">⬇ 下载</a>
                    </div>
                </div>
                <pre style="position:relative;"><code class="language-${filename.split('.').pop()}">${escapeHtml(rawContent)}</code></pre>`;
                document.getElementById('main-content').innerHTML = html;
                document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                bindCodeCopyButtons();
                document.getElementById('copy-file-btn').onclick = async () => { const ok = await copyToClipboard(rawContent); if (ok) { const btn = document.getElementById('copy-file-btn'); const orig = btn.innerText; btn.innerText = '✓ 已复制'; setTimeout(() => btn.innerText = orig, 1500); } };
                document.getElementById('view-outline').innerHTML = '<div class="p-3 text-text-3 text-sm">暂无大纲</div>';
                switchTab('prop');
            }
        }

        const renderHome = () => {
            document.getElementById('file-tree').innerHTML = '<div class="p-3 text-text-3 text-sm">请先打开一个仓库</div>';
            document.getElementById('view-prop').innerHTML = '<div class="p-3 text-text-3 text-sm">暂无仓库信息</div>';
            document.getElementById('view-outline').innerHTML = '<div class="p-3 text-text-3 text-sm">暂无大纲</div>';
            switchTab('prop');
            document.getElementById('main-content').innerHTML = `<div class="text-center mt-20"><h2 class="text-2xl font-bold text-text mb-2">GitHub 阅读器</h2><p class="text-text-2 mb-2">VS Code 风格三栏布局 · 支持图片加速 · AI 翻译</p><p class="text-text-3 text-sm">在顶部输入框粘贴仓库地址开始浏览</p></div>`;
        };

        const renderRepo = async (owner, repo, path = '') => {
            currentRepo = { owner, repo, branch: '', path: path || '' };
            const [repoInfo, langData, readme, releases] = await Promise.all([
                request(`/repos/${owner}/${repo}`), request(`/repos/${owner}/${repo}/languages`).catch(() => ({})),
                request(`/repos/${owner}/${repo}/readme`).catch(() => null), request(`/repos/${owner}/${repo}/releases?per_page=10`).catch(() => [])
            ]);
            
            currentRepo.branch = repoInfo.default_branch || 'main';
            
            initFileTree(owner, repo);
            renderPropPanel(repoInfo, langData, releases);
            if (readme) {
                const rawContent = decodeBase64(readme.content);
                currentRepo.path = 'README.md';
                
                const fixedMd = preProcessMarkdown(rawContent, owner, repo, currentRepo.branch, 'README.md');
                let parsedHtml = marked.parse(fixedMd);
                parsedHtml = postProcessHtml(parsedHtml, owner, repo, currentRepo.branch, 'README.md');
                
                document.getElementById('main-content').innerHTML = `<div class="relative">
                    <div class="action-bar">
                        <button class="action-btn" id="copy-file-btn">📋 复制</button>
                        <a href="${DOWNLOAD_PROXY + readme.download_url}" target="_blank" download="README.md" class="action-btn">⬇ 下载</a>
                        <button class="action-btn" id="trigger-translate">🌐 翻译/原文</button>
                    </div>
                    <div id="md-container" class="markdown-body bg-bg-2 border border-border rounded-lg p-6 pt-12">${parsedHtml}</div>
                </div>`;
                bindTranslateButton(rawContent);
                document.querySelectorAll('#md-container pre code').forEach(block => hljs.highlightElement(block));
                bindCodeCopyButtons(document.getElementById('md-container'));
                document.getElementById('copy-file-btn').onclick = async () => { const ok = await copyToClipboard(rawContent); if (ok) { const btn = document.getElementById('copy-file-btn'); const orig = btn.innerText; btn.innerText = '✓ 已复制'; setTimeout(() => btn.innerText = orig, 1500); } };
                generateOutline();
            } else {
                document.getElementById('main-content').innerHTML = `<div class="text-center py-20 text-text-3">该仓库没有 README 文件</div>`;
                switchTab('prop');
            }
        };

        const renderReleases = async (owner, repo) => {
            const [repoInfo, releases] = await Promise.all([request(`/repos/${owner}/${repo}`), request(`/repos/${owner}/${repo}/releases?per_page=20`)]);
            currentRepo = { owner, repo, branch: repoInfo.default_branch || 'main', path: '' };
            initFileTree(owner, repo); renderPropPanel(repoInfo, {}, releases);
            const releaseList = releases.length ? releases.map((r, i) => `<div id="release-${i}" class="bg-bg-2 border border-border rounded-lg mb-6 overflow-hidden"><div class="p-4 border-b border-border"><div class="flex justify-between items-start"><div><h3 class="text-lg font-bold text-primary">${r.name || r.tag_name}</h3><div class="text-text-3 text-xs mt-1">标签：${r.tag_name} · 发布于 ${new Date(r.published_at).toLocaleDateString()}${r.prerelease ? ' · <span class="text-yellow-500">预发布</span>' : ''}</div></div><a href="${r.html_url}" target="_blank" class="text-xs text-primary hover:underline">查看详情</a></div></div>${r.body ? `<div class="p-4 border-b border-border markdown-body">${marked.parse(r.body)}</div>` : ''}${r.assets?.length ? `<div class="p-4"><div class="text-sm font-medium text-text mb-3">下载资源（CDN代理）</div><div class="grid gap-2">${r.assets.map(asset => { const fastUrl = DOWNLOAD_PROXY + asset.browser_download_url; const fileMb = (asset.size / 1024 / 1024).toFixed(2); return `<a href="${fastUrl}" target="_blank" download="${asset.name}" class="flex justify-between items-center p-3 bg-bg-3 rounded-md hover:border-primary border border-transparent transition-colors"><span class="text-sm text-text-2">📦 ${asset.name}</span><span class="text-xs text-text-3">${fileMb} MB</span></a>`; }).join('')}</div></div>` : ''}</div>`).join('') : '<div class="text-center text-text-3 py-20">该仓库没有发布版本</div>';
            document.getElementById('main-content').innerHTML = `<div class="mb-6"><h1 class="text-xl font-bold">${owner} / ${repo} · Releases</h1><p class="text-text-2 text-sm mt-1">使用CDN加速下载发布资源</p></div>${releaseList}`;
            setTimeout(() => { document.querySelectorAll('.markdown-body pre code').forEach(block => hljs.highlightElement(block)); bindCodeCopyButtons(); }, 0);
            switchTab('prop');
        };

        // ========== 路由处理 (支持 Path 路由) ==========
        const parseRoute = () => {
            let path = window.location.pathname;
            if (path.endsWith('/index.html')) path = path.slice(0, -10);
            if (path.endsWith('/404.html')) path = path.slice(0, -8);

            if (path.startsWith('/')) path = path.slice(1);
            if (path.endsWith('/')) path = path.slice(0, -1);

            if (path.length > 0) {
                return parsePath(path);
            }

            const hash = window.location.hash.slice(1).replace(/^\/+/, '');
            if (hash) {
                return parsePath(hash);
            }

            return { type: 'home' };
        };

        function parsePath(pathStr) {
            const parts = pathStr.split('/').filter(Boolean);
            if (parts.length === 0) return { type: 'home' };
            if (parts.length === 1) return { type: 'user', name: parts[0] };
            const [owner, repo, ...rest] = parts;
            if (rest[0] === 'releases') return { type: 'releases', owner, repo };
            return { type: 'repo', owner, repo, path: rest.join('/') };
        }

        const handleRoute = async () => {
            const route = parseRoute();
            document.getElementById('main-content').innerHTML = '<div class="text-center text-text-3 py-20">加载中...</div>';
            try {
                if (route.type === 'home') renderHome();
                else if (route.type === 'user') {
                    const user = await request('/users/' + route.name); const repos = await request('/users/' + route.name + '/repos?sort=updated&per_page=30');
                    document.getElementById('file-tree').innerHTML = '<div class="p-3 text-text-3 text-sm">用户主页</div>';
                    document.getElementById('view-prop').innerHTML = `<div class="prop-section"><div class="prop-section-title">用户信息</div><div class="text-center mb-2"><img src="${user.avatar_url}" class="w-16 h-16 rounded-full mx-auto mb-2" alt=""><div class="font-bold">${user.name || route.name}</div><div class="text-text-3 text-xs">@${route.name}</div></div><div class="prop-row"><span class="label">仓库</span><span>${user.public_repos}</span></div><div class="prop-row"><span class="label">粉丝</span><span>${user.followers}</span></div></div>`;
                    document.getElementById('main-content').innerHTML = `<h1 class="text-2xl font-bold mb-4">${user.name || route.name}</h1>${user.bio ? `<p class="text-text-2 mb-6">${user.bio}</p>` : ''}<div class="grid gap-3">${repos.map(r => `<a href="#/${r.full_name}" onclick="event.preventDefault(); navigateTo('${r.full_name}')" class="block bg-bg-2 border border-border rounded-lg p-4 hover:border-primary transition-colors"><div class="flex justify-between items-center mb-2"><span class="font-medium text-primary">${r.full_name}</span><span class="text-text-3 text-xs">⭐ ${r.stargazers_count}</span></div>${r.description ? `<p class="text-text-2 text-sm line-clamp-2">${r.description}</p>` : ''}</a>`).join('')}</div>`;
                    switchTab('prop');
                }
                else if (route.type === 'releases') await renderReleases(route.owner, route.repo);
                else await renderRepo(route.owner, route.repo, route.path);
            } catch (err) {
                document.getElementById('main-content').innerHTML = `<div class="text-center py-20"><div class="text-red-400 mb-2">出错了</div><div class="text-text-3">${err.message}</div></div>`;
            }
        };

        function navigateTo(path) {
            if (path.startsWith('/')) path = path.slice(1);
            if (window.location.pathname === '/' + path) {
                handleRoute();
                return;
            }
            history.pushState(null, '', '/' + path);
            handleRoute();
        }

        const initEvents = () => {
            document.getElementById('theme-select').addEventListener('change', e => {
                const theme = e.target.value; document.documentElement.setAttribute('data-theme', theme); storage.set('theme', theme);
                const hljsName = HLJS_THEME_MAP[theme] || 'atom-one-dark';
                document.getElementById('hljs-style').href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${hljsName}.min.css`;
            });
            document.getElementById('search-input').addEventListener('keydown', e => { 
                if (e.key === 'Enter') { 
                    const rawVal = e.target.value.trim(); 
                    if (!rawVal) return; 
                    navigateTo(parseInputText(rawVal));
                } 
            });
            const modal = document.getElementById('settings-modal');
            document.getElementById('settings-btn').addEventListener('click', () => { modal.classList.remove('hidden'); modal.classList.add('flex'); document.getElementById('token-input').value = storage.get('github_token') || ''; document.getElementById('translate-api-key').value = storage.get('translate_api_key') || ''; });
            document.getElementById('close-settings').addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });
            document.getElementById('save-settings').addEventListener('click', () => {
                storage.set('github_token', document.getElementById('token-input').value.trim());
                storage.set('translate_api_key', document.getElementById('translate-api-key').value.trim());
                cache.clear(); dirCache.clear(); modal.classList.add('hidden'); modal.classList.remove('flex'); handleRoute();
            });
            modal.addEventListener('click', e => { if (e.target === modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); } });
            window.addEventListener('popstate', handleRoute);
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = storage.get('theme') || 'ayu-dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-select').value = savedTheme;
            const hljsName = HLJS_THEME_MAP[savedTheme] || 'atom-one-dark';
            document.getElementById('hljs-style').href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${hljsName}.min.css`;
            initEvents(); initSidebar(); handleRoute();
        });
    </script>
</body>
</html>
